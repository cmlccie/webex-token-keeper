[project]
name = "webex-token-keeper"
version = "0.3.0"
description = "Store dynamic Webex OAuth tokens and make them accessible via a static key."
authors = [{ name = "Chris Lunsford", email = "cm@lunsford.io" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.120",
    "jinja2>=3.1.6",
    "mangum>=0.19",
    "pydantic>=2.11",
    "webexpythonsdk>=2.0.6",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx2 = ">=2.13"
moto = { version = ">=5.1", extras = ["dynamodb"] }
pytest = ">=8.4"
ruff = ">=0.14"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# B: flake8-bugbear
# I: isort
# Q: flake8-quotes
# UP: pyupgrade
extend-select = ["B", "I", "Q", "UP"]
